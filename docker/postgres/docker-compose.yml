services:
  postgres:
    image: postgres:16-alpine
    container_name: unijourney-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-uni_journey}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-uni_journey}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: