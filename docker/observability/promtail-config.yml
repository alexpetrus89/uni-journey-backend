# observability/promtail-config.yml
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
- url: http://loki:3100/loki/api/v1/push

scrape_configs:
# --- Log dei container Docker (kafka, postgres, redis, nginx, kafka-ui...) ---
- job_name: docker-containers
  docker_sd_configs:
  - host: unix:///var/run/docker.sock
    refresh_interval: 5s
  relabel_configs:
  - source_labels: [ __meta_docker_container_name ]
    regex: '/(.*)'
    target_label: container
  - source_labels: [ __meta_docker_container_label_com_docker_compose_service ]
    target_label: service
  - source_labels: [ __meta_docker_container_label_com_docker_compose_project ]
    target_label: project

# --- Log locali del backend Spring Boot (finché non è containerizzato) ---
- job_name: unijourney-backend
  static_configs:
  - targets: [ localhost ]
    labels:
      job: backend
      service: unijourney-backend
      __path__: /backend-logs/*.log
  pipeline_stages:
  - multiline:
      firstline: '^\d{4}-\d{2}-\d{2}'
      max_wait_time: 3s
  - regex:
      expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}) \[(?P<thread>[^\]]+)\] (?P<level>\w+)\s+(?P<logger>\S+) - (?P<message>.*)'
  - labels:
      level:
      logger:
