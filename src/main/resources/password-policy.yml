password:
  min-length: 12
  pattern:
    uppercase: ".*[A-Z].*"
    lowercase: ".*[a-z].*"
    digit: ".*\\d.*"
    special: ".*[!@#$%^&*()].*"
  special-description: "(!@#$%^&*())"
  blacklist:
    enabled: true
    file: "classpath:password-blacklist.txt"
    expected-size: 1000000
    false-positive-rate: 0.01
