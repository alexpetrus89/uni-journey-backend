spring.application.name=uni-journey-backend

# app.frontend.base-url=http://localhost:4200
app.frontend.base-url=http://localhost
server.port=8081
server.forward-headers-strategy=framework

server.error.whitelabel.enabled=false
server.error.include-message=always

spring.main.allow-bean-definition-overriding=true

# ===============================
# Configuration
# ===============================
spring.config.import=optional:classpath:password-policy.yml

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# SQL Init
# ===============================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:/db/schema/schema.sql
spring.sql.init.data-locations=classpath:/db/init/*.sql

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true

# ===============================
# Liquibase Configuration
# ===============================
spring.liquibase.enabled=false

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ===============================
# CACHE Configuration
# ===============================
spring.cache.type=redis

# === REDIS CONNECTION ===
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=6000

# === CACHE SETTINGS ===
# TTL (time to live) dei dati in cache: 10 minuti
spring.cache.redis.time-to-live=600000

# Prefisso chiavi nella cache (utile per separare ambienti)
spring.cache.redis.key-prefix=degreecourse::

# ===============================
# OAuth2 Configuration
# ===============================
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# invece di http://localhost:${server.port}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token


# ===============================
# Kafka configuration
# ===============================
spring.kafka.bootstrap-servers=localhost:29092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Consumer
spring.kafka.consumer.group-id=unijourney-notification-consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Listener (ack manuale per controllare il commit dopo l'handling)
spring.kafka.listener.ack-mode=manual_immediate


# ===============================
# Logging configuration
# ===============================
# Possible values: TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
logging.config=classpath:logback-spring.xml

logging.level.root=INFO
logging.level.com.alex.unijourneybackend=TRACE
logging.level.web=TRACE
logging.level.org.springframework=TRACE
logging.level.org.springframework.http=TRACE
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=TRACE
logging.level.org.springframework.boot.autoconfigure.orm.jpa=TRACE
logging.level.org.springframework.data=TRACE
logging.level.org.springframework.data.jpa.repository.query=TRACE
logging.level.org.springframework.orm.jpa=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.SQL=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.engine.jdbc.env.internal.JdbcEnvironmentImpl=TRACE
logging.level.org.springframework.security.oauth2.core=TRACE
logging.level.org.springframework.security.oauth2.client=TRACE
logging.level.org.springframework.security.oauth2.client.registration=TRACE
logging.level.org.springframework.security.oauth2.client.web=TRACE
logging.level.org.springframework.security.oauth2.client.web.OAuth2LoginAuthenticationFilter=TRACE
logging.level.com.fasterxml.jackson=TRACE
logging.level.org.springframework.http.converter.json=TRACE

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=unrestricted







